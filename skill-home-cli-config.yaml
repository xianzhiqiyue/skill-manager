# skill-home CLI 配置文件
# 复制到 ~/.config/skill-home/config.yaml

version: "1.0"

# 注册中心配置
registry:
  endpoint: "https://soulstore.ciqtek.com/skill-home"
  api_key: "sk_Fe7wUNYNv5VrTxPK5zjFM1IYb0P9K6s1SzTsS5iRm80="  # 生产环境 API Key
  timeout: 30

# 本地配置
local:
  skills_dir: "~/.skill-home/skills"
  # 登录后会自动更新为当前登录用户的用户名，例如 "@tester"
  default_namespace: "@<login-username>"

# IDE 配置
ide:
  claude:
    enabled: true
    project_path: ".claude/skills"
    global_path: "~/.claude/skills"
  copilot:
    enabled: false
    project_path: ".github/skills"
    global_path: "~/.copilot/skills"
  cursor:
    enabled: true
    project_path: ".cursor/rules"
  codex:
    enabled: true
    project_path: ".agents/skills"
    global_path: "~/.agents/skills"

# 同步配置
sync:
  mode: "auto"
  conflict_strategy: "project_wins"
  auto_sync_on_push: false

# 安全配置
security:
  scan_on_install: true
  allow_remote_scripts: false
